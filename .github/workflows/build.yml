name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup LLVM
      run: choco install llvm -y

    - name: Compile Binaries
      shell: cmd
      run: |
        build.bat

    - name: Upload Binaries Artifact
      uses: actions/upload-artifact@v4
      with:
        name: psd-thumbnail-provider-x64
        path: |
          bin/PsdThumbnailProvider.dll
          bin/psdthumb-diag.exe
          install.bat
          uninstall.bat
          diagnostics.bat
          README.md
          LICENSE
